name: Build Cardulator

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO & esptool
      run: |
        python -m pip install --upgrade pip
        pip install platformio esptool requests

    - name: Run Native Host Tests
      run: |
        pio test -e native

    - name: Build Cardulator Firmware
      run: |
        pio run -e cardputer

    - name: Prepare Merged Binary Artifact
      id: prep
      run: |
        VERSION=$(git describe --tags --always || echo "v1.0.0")
        BIN_NAME="cardulator-${VERSION}.bin"
        
        FW_PATH=$(find .pio/build/cardputer/ -name "*.bin" ! -name "bootloader.bin" ! -name "partitions.bin" | head -n 1)
        esptool.py --chip esp32s3 merge_bin -o cardulator.bin 0x0 .pio/build/cardputer/bootloader.bin 0x8000 .pio/build/cardputer/partitions.bin 0x10000 "$FW_PATH"
        cp "cardulator.bin" "${BIN_NAME}"
        echo "bin_name=${BIN_NAME}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.prep.outputs.bin_name }}
        path: |
          ${{ steps.prep.outputs.bin_name }}
          cardulator.bin

    - name: Publish to M5Burner
      if: startsWith(github.ref, 'refs/tags/v') && env.M5BURNER_USER != '' && env.M5BURNER_PWD != ''
      env:
        M5BURNER_USER: ${{ secrets.M5BURNER_USER }}
        M5BURNER_PWD: ${{ secrets.M5BURNER_PWD }}
      run: |
        python3 scripts/m5burner_post.py --user "$M5BURNER_USER" --password "$M5BURNER_PWD" --tag "${{ steps.prep.outputs.version }}"



