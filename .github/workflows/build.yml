name: Build Cardulator

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO & esptool
      run: |
        python -m pip install --upgrade pip
        pip install platformio esptool requests

    - name: Run Native Host Tests
      run: |
        pio test -e native

    - name: Build Firmware (Cardputer & T-Deck Pro)
      run: |
        pio run -e cardputer
        pio run -e tdeck-pro

    - name: Prepare Merged Binary Artifacts
      id: prep
      run: |
        VERSION=$(git describe --tags --always || echo "v1.0.0")

        # 1. Cardputer
        CARD_FW=$(find .pio/build/cardputer/ -name "*.bin" ! -name "bootloader.bin" ! -name "partitions.bin" | head -n 1)
        CARD_BIN="cardulator-cardputer-${VERSION}.bin"
        esptool.py --chip esp32s3 merge_bin -o "cardulator-cardputer.bin" 0x0 .pio/build/cardputer/bootloader.bin 0x8000 .pio/build/cardputer/partitions.bin 0x10000 "$CARD_FW"
        cp "cardulator-cardputer.bin" "${CARD_BIN}"
        cp "cardulator-cardputer.bin" "cardulator.bin"

        # 2. T-Deck Pro
        TDECK_FW=$(find .pio/build/tdeck-pro/ -name "*.bin" ! -name "bootloader.bin" ! -name "partitions.bin" | head -n 1)
        TDECK_BIN="cardulator-tdeck-pro-${VERSION}.bin"
        esptool.py --chip esp32s3 merge_bin -o "cardulator-tdeck-pro.bin" 0x0 .pio/build/tdeck-pro/bootloader.bin 0x8000 .pio/build/tdeck-pro/partitions.bin 0x10000 "$TDECK_FW"
        cp "cardulator-tdeck-pro.bin" "${TDECK_BIN}"

        echo "card_bin=${CARD_BIN}" >> $GITHUB_OUTPUT
        echo "tdeck_bin=${TDECK_BIN}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cardulator-firmware-${{ steps.prep.outputs.version }}
        path: |
          ${{ steps.prep.outputs.card_bin }}
          ${{ steps.prep.outputs.tdeck_bin }}
          cardulator-cardputer.bin
          cardulator-tdeck-pro.bin
          cardulator.bin

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.prep.outputs.card_bin }}
          ${{ steps.prep.outputs.tdeck_bin }}
          cardulator-cardputer.bin
          cardulator-tdeck-pro.bin
          cardulator.bin
        generate_release_notes: true

    - name: Publish to M5Burner
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        M5BURNER_USER: ${{ secrets.M5BURNER_USER }}
        M5BURNER_PWD: ${{ secrets.M5BURNER_PWD }}
      run: |
        if [ -n "$M5BURNER_USER" ] && [ -n "$M5BURNER_PWD" ]; then
          python3 scripts/m5burner_post.py --user "$M5BURNER_USER" --password "$M5BURNER_PWD" --tag "${{ steps.prep.outputs.version }}"
        else
          echo "M5Burner credentials missing in secrets, skipping M5Burner release."
        fi



